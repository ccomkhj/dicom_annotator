[project]
name = "dicom-annotator"
version = "0.1.0"
description = "CVAT-style local DICOM segmentation annotator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pydicom>=2.4",
    "nibabel>=5.2",
    "numpy>=1.26",
    "pillow>=10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pytest-cov>=5.0",
]

[project.scripts]
dicom-annotator = "dicom_annotator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dicom_annotator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length enforced loosely; long DICOM/test strings are fine

[tool.ruff.lint.per-file-ignores]
# Tests interleave imports near the fixtures/helpers that use them.
"tests/*" = ["E402"]
